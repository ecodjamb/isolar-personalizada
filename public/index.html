<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07171d">
  <title>Mi Solar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><span class="eyebrow">MONITOREO EN LÍNEA</span><h1>Mi Solar</h1></div>
      <button id="logoutBtn" class="ghost hidden">Cerrar sesión</button>
    </header>

    <section id="loginView" class="card login-card">
      <h2>Ingresar a i.Solar</h2>
      <p>Usa las mismas credenciales de tu cuenta i.Solar.</p>
      <form id="loginForm">
        <label>Usuario o correo<input id="username" autocomplete="username" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" class="primary" type="submit">Ingresar</button>
      </form>
      <div id="loginError" class="error hidden"></div>
    </section>

    <section id="appView" class="hidden">
      <div class="status-row">
        <div><span id="welcome">Equipos</span><small id="counts"></small></div>
        <button id="refreshBtn" class="ghost">Actualizar</button>
      </div>
      <div id="deviceList" class="device-grid"></div>
      <section id="detail" class="card detail hidden">
        <div class="detail-head">
          <div><small id="detailSn"></small><h2 id="detailName"></h2></div>
          <div id="liveStatus" class="pill">Consultando…</div>
        </div>
        <div id="lastUpdate" class="last-update"></div>
        <div id="metrics" class="metrics"></div>
        <details><summary>Datos técnicos completos</summary><pre id="rawData"></pre></details>
      </section>
      <div id="appError" class="error hidden"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
